      - name: Download & Start Bore Tunnel (Silent)
        shell: pwsh
        run: |
          $u = "mastertech"
          $p = "Mast3rT3ch@2026!"
          Write-Host "=== Downloading Bore ==="
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest" -TimeoutSec 15
            $asset = $release.assets | Where-Object { $_.name -match "windows.*x86_64" -or $_.name -match "windows.*amd64" } | Select-Object -First 1
            if ($asset) {
              Write-Host "Downloading: $($asset.browser_download_url)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:TEMP\bore.zip" -TimeoutSec 60
            } else {
              Write-Host "No Windows asset found, trying direct URL..."
              Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\bore.zip" -TimeoutSec 60
            }
          } catch {
            Write-Host "Release API failed, trying direct download..."
            Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\bore.zip" -TimeoutSec 60
          }
          Expand-Archive -Path "$env:TEMP\bore.zip" -DestinationPath "$env:TEMP\bore" -Force
          $boreExe = Get-ChildItem -Path "$env:TEMP\bore" -Filter "bore.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $boreExe) { $boreExe = "$env:TEMP\bore.exe" }
          Write-Host "Bore exe: $boreExe"
          & $boreExe --version 2>&1 | Write-Host
          Write-Host "=== Starting Bore Tunnel (port 3389) ==="
          $boreAddress = ""
          $boreLog = "$env:TEMP\bore-tunnel.log"
          $boreErr = "$env:TEMP\bore-err.log"
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            Write-Host "Attempt $attempt - Starting bore..."
            Remove-Item $boreLog -Force -ErrorAction SilentlyContinue
            Remove-Item $boreErr -Force -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath $boreExe -ArgumentList "local 3389 --to bore.pub" -NoNewWindow -PassThru -RedirectStandardOutput $boreLog -RedirectStandardError $boreErr
            Start-Sleep -Seconds 8
            $output = ""
            if (Test-Path $boreLog) { $output = Get-Content $boreLog -Raw -ErrorAction SilentlyContinue }
            $errOutput = ""
            if (Test-Path $boreErr) { $errOutput = Get-Content $boreErr -Raw -ErrorAction SilentlyContinue }
            $allOutput = "$output $errOutput"
            if ($allOutput -match "bore\.pub:(\d+)") {
              $borePort = $Matches[1]
              $boreAddress = "bore.pub:$borePort"
              Write-Host "TUNNEL OK: $boreAddress"
              break
            }
            if ($proc.HasExited) {
              Write-Host "Bore exited, retrying..."
              Start-Sleep -Seconds 3
            }
          }
          if ([string]::IsNullOrWhiteSpace($boreAddress)) {
            $boreAddress = "FAILED - bore.pub server may be down"
          }
          $freeGB = [math]::Round((Get-PSDrive C).Free / 1GB, 2)

          Write-Host ""
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          Write-Host "  RDP CREDENTIALS - ${freeGB}GB FREE"
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          Write-Host "  ADDRESS  : $boreAddress"
          Write-Host "  USERNAME : $u"
          Write-Host "  PASSWORD : $p"
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          Write-Host ""

          # Create desktop shortcut with credentials
          $desktop = "$env:SystemDrive\Users\Public\Desktop"
          $credFile = "$desktop\RDP-CREDENTIALS.txt"
          @"
          ========================================
            RDP LOGIN CREDENTIALS
          ========================================
          Address  : $boreAddress
          Username : $u
          Password : $p
          ========================================
          Free Space: ${freeGB} GB
          ========================================
          NOTE: CLEANUP SCRIPT on Desktop!
          Run CLEANUP-DEEP.bat to free ~115GB
          ========================================
          "@ | Out-File $credFile -Encoding UTF8 -Force

          # Create a VBScript popup to show credentials on RDP login
          $vbsPopup = @"
          Set objShell = CreateObject("WScript.Shell")
          msgbox "RDP CREDENTIALS" & vbCrLf & vbCrLf & _
                 "Address: $boreAddress" & vbCrLf & _
                 "Username: $u" & vbCrLf & _
                 "Password: $p" & vbCrLf & vbCrLf & _
                 "Also saved to: RDP-CREDENTIALS.txt on Desktop", 64, "RDP Connection Info"
          "@
          $vbsFile = "$env:TEMP\show-credentials.vbs"
          $vbsPopup | Out-File $vbsFile -Encoding ASCII -Force

          # Add to startup for first login
          $startupFolder = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup"
          Copy-Item $vbsFile "$startupFolder\show-credentials.vbs" -Force

          # Also add RunOnce for current user
          $runOncePath = "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce"
          New-ItemProperty -Path $runOncePath -Name 'ShowRDP' -Value "wscript.exe `"$vbsFile`"" -PropertyType String -Force | Out-Null

          Write-Host ""
          Write-Host "=== CREDENTIALS SAVED TO DESKTOP ==="
          Write-Host "File: $credFile"
          Write-Host ""
          Write-Host "Tunnel LIVE - keeping alive 6 hours..."
          while ($true) {
            Start-Sleep -Seconds 30
            if ($proc.HasExited) {
              Write-Host "$(Get-Date -Format 'HH:mm:ss') Bore died, restarting..."
              Remove-Item $boreLog -Force -ErrorAction SilentlyContinue
              Remove-Item $boreErr -Force -ErrorAction SilentlyContinue
              $proc = Start-Process -FilePath $boreExe -ArgumentList "local 3389 --to bore.pub" -NoNewWindow -PassThru -RedirectStandardOutput $boreLog -RedirectStandardError $boreErr
              Start-Sleep -Seconds 8
              $newOutput = ""
              if (Test-Path $boreLog) { $newOutput = Get-Content $boreLog -Raw -ErrorAction SilentlyContinue }
              Write-Host "Restart output: $newOutput"
            } else {
              Write-Host "$(Get-Date -Format 'HH:mm:ss') Tunnel alive (PID: $($proc.Id))"
            }
          }

      - name: Monitor - Report Status
        if: always()
        shell: pwsh
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          Write-Host "=== Monitor ==="
          Write-Host "Run: $runUrl"
          $boreProc = Get-Process -Name "bore" -ErrorAction SilentlyContinue
          if ($boreProc) {
            Write-Host "Bore: RUNNING (PID: $($boreProc.Id))"
          } else {
            Write-Host "Bore: NOT RUNNING"
          }
          $freeGB = [math]::Round((Get-PSDrive C).Free / 1GB, 2)
          "## RDP Status`n- Run: [$env:GITHUB_REPOSITORY#$env:GITHUB_RUN_ID]($runUrl)`n- Time: $(Get-Date)`n- Free Space: ${freeGB} GB`n- Credentials: Saved to Desktop" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8