name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest        # 4 core / 16 GB RAM (public repo = free)
    timeout-minutes: 360           # max 6 hours, phir machine auto-destroy
    steps:
      - name: Enable RDP + set random password
        shell: powershell
        run: |
          # Random strong password generate karo
          Add-Type -AssemblyName System.Web
          $pass = [System.Web.Security.Membership]::GeneratePassword(16, 4)
          net user runneradmin "$pass"

          # RDP enable karo
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "=================================================="
          Write-Host "RDP Username : runneradmin"
          Write-Host "RDP Password : $pass"
          Write-Host "=================================================="

      - name: Setup ngrok + start tunnel
        shell: powershell
        run: |
          choco install ngrok -y
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

          # ngrok ko background mein start karo, output log file mein
          Start-Process ngrok -ArgumentList "tcp 3389 --region in --log=stdout --log-format=logfmt" -RedirectStandardOutput "$env:TEMP\ngrok.log" -RedirectStandardError "$env:TEMP\ngrok.err" -WindowStyle Hidden

          # API ready hone tak retry karo (max ~60s)
          $public = $null
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep 3
            try {
              $info = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4040/api/tunnels).Content | ConvertFrom-Json
              if ($info.tunnels.Count -gt 0) {
                $public = $info.tunnels[0].public_url
                break
              }
            } catch {
              Write-Host "Attempt $i : ngrok API abhi ready nahi..."
            }
          }

          if (-not $public) {
            Write-Host "===== ngrok start nahi hua. Log niche: ====="
            if (Test-Path "$env:TEMP\ngrok.log") { Get-Content "$env:TEMP\ngrok.log" }
            if (Test-Path "$env:TEMP\ngrok.err") { Get-Content "$env:TEMP\ngrok.err" }
            exit 1
          }

          Write-Host "=================================================="
          Write-Host "RDP Address : $public"
          Write-Host "(Remote Desktop mein 'tcp://' hata ke sirf host:port daalo)"
          Write-Host "=================================================="

      - name: Keep alive (6 hours)
        shell: powershell
        run: Start-Sleep 21600
