name: WindowsRDP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rdp-tunnel
  cancel-in-progress: true

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Save Cleanup Script to Desktop
        shell: pwsh
        run: |
          $desktop = "$env:SystemDrive\Users\Public\Desktop"
          $script = @"
          @echo off
          title SYSTEM CLEANUP - DELETE ALL UNUSED PROGRAMS
          color 0C
          echo ============================================================
          echo   WARNING: THIS SCRIPT WILL DELETE THE FOLLOWING:
          echo ============================================================
          echo.
          echo   --- PART 1: HEAVY PROGRAMS (~76 GB) ---
          echo   [1]  Microsoft Visual Studio            ~31.6 GB
          echo   [2]  Android SDK (x86)                  ~14.0 GB
          echo   [3]  dotnet SDK                          ~11.6 GB
          echo   [4]  GitHub hostedtoolcache               ~4.8 GB
          echo   [5]  ghcup (Haskell)                      ~4.2 GB
          echo   [6]  rtools45 (R)                         ~3.1 GB
          echo   [7]  Azure Cosmos DB Emulator             ~2.5 GB
          echo   [8]  LLVM                                 ~2.4 GB
          echo   [9]  MongoDB                              ~2.0 GB
          echo.
          echo   --- PART 2: ADDITIONAL PROGRAMS (~15.7 GB) ---
          echo   [10] Windows SDK (10.0.26100.8249)        2.28 GB
          echo   [11] PostgreSQL 17                        1.02 GB
          echo   [12] Strawberry Perl (64-bit)             1.00 GB
          echo   [13] OpenSSL 3.6.3 (64-bit)              0.83 GB
          echo   [14] Unity Hub 3.21.0                     0.56 GB
          echo   [15] Microsoft Azure Service Fabric       0.56 GB
          echo   [16] MySQL Server 8.0                     0.55 GB
          echo   [17] SQL Server Integration Services      0.37 GB
          echo   [18] AWS SAM CLI                          0.35 GB
          echo   [19] Mozilla Firefox                      0.34 GB
          echo   [20] SQL Server 2025 LocalDB              0.31 GB
          echo   [21] WiX Toolset v3.14                    0.28 GB
          echo   [22] AWS CLI v2                           0.19 GB
          echo   [23] R for Windows 4.6.1                  0.19 GB
          echo   [24] CMake                                0.16 GB
          echo   [25] Windows SDK (10.0.26100.7705)        0.10 GB
          echo   [26] ImageMagick 7.1.2-25                 0.06 GB
          echo   [27] Azure Service Fabric SDK             0.06 GB
          echo   [28] IIS 10.0 Express                     0.05 GB
          echo.
          echo   TOTAL ESTIMATED: ~92 GB
          echo.
          echo ============================================================
          echo   Close this window NOW to abort.
          echo   Otherwise, deletion starts in 10 seconds...
          echo ============================================================
          timeout /t 10 /nobreak >nul

          echo.
          echo [STARTING CLEANUP...]
          echo.

          :: ============================================================
          :: PART 1: HEAVY PROGRAMS
          :: ============================================================

          echo [1/28] Deleting Microsoft Visual Studio...
          if exist "C:\Program Files\Microsoft Visual Studio" (
              rd /s /q "C:\Program Files\Microsoft Visual Studio" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [2/28] Deleting Android SDK...
          if exist "C:\Program Files (x86)\Android" (
              rd /s /q "C:\Program Files (x86)\Android" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )
          if exist "C:\Android" (
              rd /s /q "C:\Android" 2>nul
              echo        C:\Android [DELETED]
          )

          echo.
          echo [3/28] Deleting dotnet SDK...
          if exist "C:\Program Files\dotnet" (
              rd /s /q "C:\Program Files\dotnet" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )
          if exist "C:\Program Files (x86)\dotnet" (
              rd /s /q "C:\Program Files (x86)\dotnet" 2>nul
              echo        (x86) [DELETED]
          )

          echo.
          echo [4/28] Deleting GitHub hostedtoolcache...
          if exist "C:\hostedtoolcache" (
              rd /s /q "C:\hostedtoolcache" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [5/28] Deleting ghcup (Haskell)...
          if exist "C:\ghcup" (
              rd /s /q "C:\ghcup" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [6/28] Deleting rtools45 (R)...
          if exist "C:\rtools45" (
              rd /s /q "C:\rtools45" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )
          if exist "C:\Program Files\R" (
              rd /s /q "C:\Program Files\R" 2>nul
              echo        Program Files\R [DELETED]
          )

          echo.
          echo [7/28] Deleting Azure Cosmos DB Emulator...
          if exist "C:\Program Files\Azure Cosmos DB Emulator" (
              rd /s /q "C:\Program Files\Azure Cosmos DB Emulator" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [8/28] Deleting LLVM...
          if exist "C:\Program Files\LLVM" (
              rd /s /q "C:\Program Files\LLVM" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [9/28] Deleting MongoDB...
          if exist "C:\Program Files\MongoDB" (
              rd /s /q "C:\Program Files\MongoDB" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )
          if exist "C:\Program Files\mongosh" (
              rd /s /q "C:\Program Files\mongosh" 2>nul
              echo        mongosh [DELETED]
          )

          :: ============================================================
          :: PART 2: ADDITIONAL PROGRAMS
          :: ============================================================

          echo.
          echo [10/28] Deleting Windows SDK...
          if exist "C:\Program Files (x86)\Windows Kits\10" (
              rd /s /q "C:\Program Files (x86)\Windows Kits\10" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [11/28] Deleting PostgreSQL 17...
          if exist "C:\Program Files\PostgreSQL" (
              rd /s /q "C:\Program Files\PostgreSQL" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [12/28] Deleting Strawberry Perl...
          if exist "C:\Strawberry" (
              rd /s /q "C:\Strawberry" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [13/28] Deleting OpenSSL...
          if exist "C:\Program Files\OpenSSL" (
              rd /s /q "C:\Program Files\OpenSSL" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [14/28] Deleting Unity Hub...
          if exist "C:\Program Files\Unity Hub" (
              rd /s /q "C:\Program Files\Unity Hub" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [15/28] Deleting Microsoft Azure Service Fabric...
          if exist "C:\Program Files\Microsoft Service Fabric" (
              rd /s /q "C:\Program Files\Microsoft Service Fabric" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [16/28] Deleting MySQL Server 8.0...
          if exist "C:\Program Files\MySQL" (
              rd /s /q "C:\Program Files\MySQL" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [17/28] Deleting SQL Server Integration Services...
          if exist "C:\Program Files (x86)\Microsoft SQL Server" (
              rd /s /q "C:\Program Files (x86)\Microsoft SQL Server" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [18/28] Deleting AWS SAM CLI...
          if exist "C:\Program Files\Amazon" (
              rd /s /q "C:\Program Files\Amazon" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [19/28] Deleting Mozilla Firefox...
          if exist "C:\Program Files\Mozilla Firefox" (
              rd /s /q "C:\Program Files\Mozilla Firefox" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [20/28] Deleting SQL Server 2025 LocalDB...
          if exist "C:\Program Files\Microsoft SQL Server" (
              rd /s /q "C:\Program Files\Microsoft SQL Server" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [21/28] Deleting WiX Toolset v3.14...
          if exist "C:\Program Files (x86)\WiX Toolset v3.14" (
              rd /s /q "C:\Program Files (x86)\WiX Toolset v3.14" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [22/28] Deleting AWS CLI v2...
          if exist "C:\Program Files\Amazon\AWSCLI" (
              rd /s /q "C:\Program Files\Amazon\AWSCLI" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [23/28] Deleting R for Windows...
          if exist "C:\Program Files\R" (
              rd /s /q "C:\Program Files\R" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [24/28] Deleting CMake...
          if exist "C:\Program Files\CMake" (
              rd /s /q "C:\Program Files\CMake" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [25/28] Windows SDK (10.0.26100.7705)...
          echo        (Already removed with item 10)

          echo.
          echo [26/28] Deleting ImageMagick...
          if exist "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI" (
              rd /s /q "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          echo.
          echo [27/28] Azure Service Fabric SDK...
          echo        (Already removed with item 15)

          echo.
          echo [28/28] Deleting IIS 10.0 Express...
          if exist "C:\Program Files\IIS Express" (
              rd /s /q "C:\Program Files\IIS Express" 2>nul
              echo        [DELETED]
          ) else (
              echo        [NOT FOUND - SKIPPED]
          )

          :: ============================================================
          :: CLEANUP COMPLETE
          :: ============================================================
          echo.
          echo ============================================================
          echo   CLEANUP COMPLETE! ALL 28 ITEMS PROCESSED.
          echo ============================================================
          echo.
          echo   Checking free space...
          echo.
          for /f "tokens=2 delims==" %%a in ('wmic logicaldisk where "DeviceID='C:'" get FreeSpace /value ^| findstr "="') do set /a "freeGB=%%a / 1073741824"
          echo   C: Drive Free Space: %freeGB% GB
          echo.
          echo   Press any key to exit...
          pause >nul
          "@
          $script | Out-File "$desktop\CLEANUP-ALL.bat" -Encoding ASCII -Force
          Write-Host "Cleanup script saved to: $desktop\CLEANUP-ALL.bat"

      - name: Create User & Set Password
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $u = "mastertech"
          $p = "Mast3rT3ch@2026!"
          $secpassword = ConvertTo-SecureString -AsPlainText $p -Force
          New-LocalUser -Name $u -Password $secpassword -FullName $u -Description "RDP User" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue
          Set-LocalUser -Name "runneradmin" -Password $secpassword
          Write-Host "User created: $u"

      - name: Enable RDP + Aggressive Optimization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $u = "mastertech"
          Write-Host "=== ENABLING RDP ==="
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0

          Write-Host "=== RDP PERFORMANCE SETTINGS ==="
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'ColorDepth' -Value 2
          $tsPath = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          New-ItemProperty -Path $tsPath -Name 'AVC444ModePreferred' -Value 0 -PropertyType DWord -Force
          New-ItemProperty -Path $tsPath -Name 'AVCHardwareEncodePreferred' -Value 0 -PropertyType DWord -Force
          New-ItemProperty -Path $tsPath -Name 'bEnumerateHWBeforeSW' -Value 0 -PropertyType DWord -Force
          New-ItemProperty -Path $tsPath -Name 'AVCPreferredProfile' -Value 0 -PropertyType DWord -Force
          New-ItemProperty -Path $tsPath -Name 'fEnableRemoteFXAdvancedRemoteApp' -Value 0 -PropertyType DWord -Force
          New-ItemProperty -Path $tsPath -Name 'EncoderGraphicsCacheEnabled' -Value 1 -PropertyType DWord -Force
          New-ItemProperty -Path $tsPath -Name 'SelectTransport' -Value 1 -PropertyType DWord -Force
          New-ItemProperty -Path $tsPath -Name 'MaxInstanceCount' -Value 99 -PropertyType DWord -Force
          $rdpTcp = 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $rdpTcp -Name 'MaxInstanceCount' -Value 99

          Write-Host "=== TCP LOW LATENCY ==="
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TcpAckFrequency' -Value 1
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TCPNoDelay' -Value 1
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TcpDelAckTicks' -Value 0

          Write-Host "=== DISABLE FIREWALL ==="
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False

          Write-Host "=== KILL HEAVY PROCESSES ==="
          Get-Process -Name "OneDrive","MicrosoftEdge","msedge","Teams","TeamsPlaywright","Outlook" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Service -Name "WSearch" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "WSearch" -StartupType Disabled -ErrorAction SilentlyContinue

          Write-Host "=== AGGRESSIVE VISUAL EFFECTS OFF ==="
          $visPath = 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects'
          Set-ItemProperty -Path $visPath -Name 'VisualFXSetting' -Value 2 -Force
          $advPath = 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
          Set-ItemProperty -Path $advPath -Name 'TaskbarAnimations' -Value 0 -Force
          Set-ItemProperty -Path $advPath -Name 'ListviewShadow' -Value 0 -Force
          Set-ItemProperty -Path $advPath -Name 'IconsOnly' -Value 1 -Force
          Set-ItemProperty -Path $advPath -Name 'ListThreshold' -Value 1 -Force
          Set-ItemProperty -Path $advPath -Name 'ThumbnailSize' -Value 32 -Force

          Write-Host "=== DOWNLOAD WALLPAPER ==="
          $wallpaperDir = "C:\Users\Public\Pictures"
          New-Item -ItemType Directory -Path $wallpaperDir -Force | Out-Null
          $wallpaperFile = "$wallpaperDir\wallpaper.jpg"
          $wallpaperUrl = "https://cdn.wallpaperhub.app/cloudcache/0/3/6/b/a/1/036ba136f0cfeea15461196787bc4876b5bd52b9.jpg"
          try {
            Invoke-WebRequest -Uri $wallpaperUrl -OutFile $wallpaperFile -TimeoutSec 30
            $size = (Get-Item $wallpaperFile).Length
            Write-Host "Wallpaper downloaded: $size bytes"
            if ($size -lt 1000) { throw "File too small" }
          } catch {
            Write-Host "Wallpaper download failed: $_"
            $wallpaperFile = ''
          }

          Write-Host "=== APPLY DARK MODE TO DEFAULT PROFILE (for all new users) ==="
          $defaultSrc = "C:\Users\Default\NTUSER.DAT"
          $defaultTemp = "$env:TEMP\default_NTUSER.DAT"
          if (Test-Path $defaultSrc) {
            Copy-Item $defaultSrc $defaultTemp -Force
            $loadDef = reg load "HKU\defaultprofile" "$defaultTemp" 2>&1
            Write-Host "Load default: $loadDef"
            $themeBase = "Registry::HKEY_USERS\defaultprofile\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
            if (-not (Test-Path $themeBase)) { New-Item -Path $themeBase -Force | Out-Null }
            Set-ItemProperty -Path $themeBase -Name 'EnableTransparency' -Value 0 -Force
            Set-ItemProperty -Path $themeBase -Name 'ColorPrevalence' -Value 0 -Force
            Set-ItemProperty -Path $themeBase -Name 'AppsUseLightTheme' -Value 0 -Force
            Set-ItemProperty -Path $themeBase -Name 'SystemUsesLightTheme' -Value 0 -Force
            $deskBase = "Registry::HKEY_USERS\defaultprofile\Control Panel\Desktop"
            Set-ItemProperty -Path $deskBase -Name 'Wallpaper' -Value $wallpaperFile -Force
            Set-ItemProperty -Path $deskBase -Name 'TileWallpaper' -Value 0 -Force
            Set-ItemProperty -Path $deskBase -Name 'WallpaperStyle' -Value 10 -Force
            $advBase = "Registry::HKEY_USERS\defaultprofile\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
            if (-not (Test-Path $advBase)) { New-Item -Path $advBase -Force | Out-Null }
            Set-ItemProperty -Path $advBase -Name 'TaskbarSmallIcons' -Value 1 -Force
            Set-ItemProperty -Path $advBase -Name 'TaskbarAnimations' -Value 0 -Force
            Set-ItemProperty -Path $advBase -Name 'IconsOnly' -Value 1 -Force
            $unloadDef = reg unload "HKU\defaultprofile" 2>&1
            Write-Host "Unload default: $unloadDef"
            Copy-Item $defaultTemp $defaultSrc -Force
            Write-Host "Default profile: dark mode + wallpaper applied"
          } else {
            Write-Host "Default NTUSER.DAT not found!"
          }

          Write-Host "=== APPLY DARK MODE TO $u PROFILE ==="
          $userDir = "C:\Users\$u"
          $userHiveTemp = "$env:TEMP\${u}_NTUSER.DAT"
          New-Item -ItemType Directory -Path $userDir -Force | Out-Null
          if (-not (Test-Path "$userDir\NTUSER.DAT")) {
            Copy-Item $defaultTemp "$userDir\NTUSER.DAT" -Force
          }
          if (Test-Path "$userDir\NTUSER.DAT") {
            Copy-Item "$userDir\NTUSER.DAT" $userHiveTemp -Force
            $loadUser = reg load "HKU\mastertech_hive" "$userHiveTemp" 2>&1
            Write-Host "Load ${u}: $loadUser"
            $uTheme = "Registry::HKEY_USERS\mastertech_hive\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
            if (-not (Test-Path $uTheme)) { New-Item -Path $uTheme -Force | Out-Null }
            Set-ItemProperty -Path $uTheme -Name 'EnableTransparency' -Value 0 -Force
            Set-ItemProperty -Path $uTheme -Name 'ColorPrevalence' -Value 0 -Force
            Set-ItemProperty -Path $uTheme -Name 'AppsUseLightTheme' -Value 0 -Force
            Set-ItemProperty -Path $uTheme -Name 'SystemUsesLightTheme' -Value 0 -Force
            $uDesk = "Registry::HKEY_USERS\mastertech_hive\Control Panel\Desktop"
            Set-ItemProperty -Path $uDesk -Name 'Wallpaper' -Value $wallpaperFile -Force
            Set-ItemProperty -Path $uDesk -Name 'TileWallpaper' -Value 0 -Force
            Set-ItemProperty -Path $uDesk -Name 'WallpaperStyle' -Value 10 -Force
            $uAdv = "Registry::HKEY_USERS\mastertech_hive\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
            if (-not (Test-Path $uAdv)) { New-Item -Path $uAdv -Force | Out-Null }
            Set-ItemProperty -Path $uAdv -Name 'TaskbarSmallIcons' -Value 1 -Force
            Set-ItemProperty -Path $uAdv -Name 'TaskbarAnimations' -Value 0 -Force
            Set-ItemProperty -Path $uAdv -Name 'IconsOnly' -Value 1 -Force
            $unloadUser = reg unload "HKU\mastertech_hive" 2>&1
            Write-Host "Unload ${u}: $unloadUser"
            Copy-Item $userHiveTemp "$userDir\NTUSER.DAT" -Force
            Write-Host "$u profile: dark mode + wallpaper applied"
          } else {
            Write-Host "$u NTUSER.DAT not available"
          }

          Write-Host "=== ALSO SET VIA RUNONCE (backup method) ==="
          $runOncePath = "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce"
          $psScript = "C:\Users\Public\apply-darkmode.ps1"
          $psContent = @"
          Set-ItemProperty -Path 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0 -Force
          Set-ItemProperty -Path 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0 -Force
          Set-ItemProperty -Path 'Registry::HKEY_CURRENT_USER\Control Panel\Desktop' -Name 'Wallpaper' -Value '$wallpaperFile' -Force
          Set-ItemProperty -Path 'Registry::HKEY_CURRENT_USER\Control Panel\Desktop' -Name 'WallpaperStyle' -Value 10 -Force
          "@
          $psContent | Out-File $psScript -Encoding UTF8 -Force
          New-ItemProperty -Path $runOncePath -Name 'ApplyDarkMode' -Value "powershell -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$psScript`"" -PropertyType String -Force | Out-Null
          Write-Host "RunOnce entry created for first login"

          Write-Host "=== DISABLE HEAVY SERVICES ==="
          $servicesToDisable = @('SysMain','DiagTrack','diagnosticshub.standardcollector.service','dmwappushservice','MapsBroker','lfsvc','SharedAccess','RemoteRegistry','XblAuthManager','XblGameSave','XboxGipSvc','wuauserv','BITS')
          foreach ($svc in $servicesToDisable) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          Write-Host "=== DISABLE PREFETCH/SUPERFETCH ==="
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters' -Name 'EnablePrefetcher' -Value 0 -Force
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters' -Name 'EnableSuperfetch' -Value 0 -Force

          Write-Host "=== HIGH PERFORMANCE POWER ==="
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          Write-Host "=== DISABLE GAME BAR / DVR ==="
          $gamePath = 'Registry::HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR'
          if (-not (Test-Path $gamePath)) { New-Item -Path $gamePath -Force | Out-Null }
          New-ItemProperty -Path $gamePath -Name 'AppCaptureEnabled' -Value 0 -PropertyType DWord -Force
          $gameBarPath = 'Registry::HKEY_CURRENT_USER\System\GameConfigStore'
          if (-not (Test-Path $gameBarPath)) { New-Item -Path $gameBarPath -Force | Out-Null }
          New-ItemProperty -Path $gameBarPath -Name 'GameDVR_Enabled' -Value 0 -PropertyType DWord -Force

          Write-Host "=== DISABLE WINDOWS DEFENDER REAL-TIME ==="
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableScriptScanning $true -ErrorAction SilentlyContinue

          Write-Host "=== FLUSH DNS + NETWORK RESET ==="
          ipconfig /flushdns | Out-Null
          netsh interface tcp set global autotuninglevel=disabled | Out-Null

          Write-Host "=== AGGRESSIVE RDP OPTIMIZATION DONE ==="

      - name: Download & Start Bore Tunnel + Show Credentials
        shell: pwsh
        run: |
          $u = "mastertech"
          $p = "Mast3rT3ch@2026!"

          Write-Host "=== Downloading Bore ==="
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest" -TimeoutSec 15
            $asset = $release.assets | Where-Object { $_.name -match "windows.*x86_64" -or $_.name -match "windows.*amd64" } | Select-Object -First 1
            if ($asset) {
              Write-Host "Downloading: $($asset.browser_download_url)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:TEMP\bore.zip" -TimeoutSec 60
            } else {
              Write-Host "No Windows asset found, trying direct URL..."
              Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\bore.zip" -TimeoutSec 60
            }
          } catch {
            Write-Host "Release API failed, trying direct download..."
            Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\bore.zip" -TimeoutSec 60
          }
          Expand-Archive -Path "$env:TEMP\bore.zip" -DestinationPath "$env:TEMP\bore" -Force
          $boreExe = Get-ChildItem -Path "$env:TEMP\bore" -Filter "bore.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $boreExe) { $boreExe = "$env:TEMP\bore.exe" }
          Write-Host "Bore exe: $boreExe"
          & $boreExe --version 2>&1 | Write-Host

          Write-Host "=== Starting Bore Tunnel (port 3389) ==="
          $boreAddress = ""
          $boreLog = "$env:TEMP\bore-tunnel.log"
          $boreErr = "$env:TEMP\bore-err.log"

          for ($attempt = 1; $attempt -le 10; $attempt++) {
            Write-Host "Attempt $attempt - Starting bore..."
            Remove-Item $boreLog -Force -ErrorAction SilentlyContinue
            Remove-Item $boreErr -Force -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath $boreExe -ArgumentList "local 3389 --to bore.pub" -NoNewWindow -PassThru -RedirectStandardOutput $boreLog -RedirectStandardError $boreErr
            Start-Sleep -Seconds 8

            $output = ""
            if (Test-Path $boreLog) { $output = Get-Content $boreLog -Raw -ErrorAction SilentlyContinue }
            $errOutput = ""
            if (Test-Path $boreErr) { $errOutput = Get-Content $boreErr -Raw -ErrorAction SilentlyContinue }

            Write-Host "stdout: $output"
            Write-Host "stderr: $errOutput"

            $allOutput = "$output $errOutput"
            if ($allOutput -match "bore\.pub:(\d+)") {
              $borePort = $Matches[1]
              $boreAddress = "bore.pub:$borePort"
              Write-Host "TUNNEL OK: $boreAddress"
              break
            }

            if ($proc.HasExited) {
              Write-Host "Bore exited, retrying..."
              Start-Sleep -Seconds 3
            }
          }

          if ([string]::IsNullOrWhiteSpace($boreAddress)) {
            $boreAddress = "FAILED - bore.pub server may be down"
          }

          $freeGB = [math]::Round((Get-PSDrive C).Free / 1GB, 2)
          $passB64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($p))

          Write-Host ""
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          Write-Host "  RDP CREDENTIALS - ${freeGB}GB FREE"
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          Write-Host "  ADDRESS  : $boreAddress"
          Write-Host "  USERNAME : $u"
          Write-Host "  PASSWORD : $p"
          Write-Host "  PASS B64 : $passB64"
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          Write-Host ""

          # Write to Step Summary (visible on Actions page)
          @"
          ## RDP Connection Details
          | Field | Value |
          |-------|-------|
          | Address | ``$boreAddress`` |
          | Username | ``$u`` |
          | Password | ``$p`` |
          | Password B64 | ``$passB64`` |
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

          # Save to desktop file
          $credFile = "$env:SystemDrive\Users\Public\Desktop\RDP-CREDENTIALS.txt"
          @"
          RDP LOGIN CREDENTIALS
          ======================
          Address  : $boreAddress
          Username : $u
          Password : $p
          Pass B64 : $passB64
          ======================
          "@ | Out-File $credFile -Encoding UTF8 -Force

          Write-Host "Credentials saved to Step Summary + Desktop"
          Write-Host ""
          Write-Host "Tunnel LIVE - keeping alive 6 hours..."

          while ($true) {
            Start-Sleep -Seconds 30
            if ($proc.HasExited) {
              Write-Host "$(Get-Date -Format 'HH:mm:ss') Bore died, restarting..."
              Remove-Item $boreLog -Force -ErrorAction SilentlyContinue
              Remove-Item $boreErr -Force -ErrorAction SilentlyContinue
              $proc = Start-Process -FilePath $boreExe -ArgumentList "local 3389 --to bore.pub" -NoNewWindow -PassThru -RedirectStandardOutput $boreLog -RedirectStandardError $boreErr
              Start-Sleep -Seconds 8
              $newOutput = ""
              if (Test-Path $boreLog) { $newOutput = Get-Content $boreLog -Raw -ErrorAction SilentlyContinue }
              Write-Host "Restart output: $newOutput"
            } else {
              Write-Host "$(Get-Date -Format 'HH:mm:ss') Tunnel alive (PID: $($proc.Id))"
            }
          }

      - name: Monitor - Report Status
        if: always()
        shell: pwsh
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          Write-Host "=== Monitor ==="
          Write-Host "Run: $runUrl"
          $boreProc = Get-Process -Name "bore" -ErrorAction SilentlyContinue
          if ($boreProc) {
            Write-Host "Bore: RUNNING (PID: $($boreProc.Id))"
          } else {
            Write-Host "Bore: NOT RUNNING"
          }
          "## RDP Status`n- Run: [$env:GITHUB_REPOSITORY#$env:GITHUB_RUN_ID]($runUrl)`n- Time: $(Get-Date)`n- Username: ``mastertech```n- Password: ``Mast3rT3ch@2026!``" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
