      - name: Save Dark Mode + Wallpaper Script
        shell: pwsh
        run: |
          $desktop = "$env:SystemDrive\Users\Public\Desktop"
          $dmLines = @(
            '# ============================================',
            '# DARK MODE + WALLPAPER SETUP',
            '# ============================================',
            '$ErrorActionPreference = "Stop"',
            '$downloadDir = "$env:USERPROFILE\Downloads\Wallpaper"',
            'if (!(Test-Path $downloadDir)) {',
            '    New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null',
            '}',
            '',
            'Write-Host "DARK MODE ENABLE..." -ForegroundColor Yellow',
            'try {',
            '    Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue',
            '    Start-Sleep -Seconds 2',
            '    $personalizePath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"',
            '    $dwmPath = "HKCU:\SOFTWARE\Microsoft\Windows\DWM"',
            '    @($personalizePath, $dwmPath) | ForEach-Object {',
            '        if (!(Test-Path $_)) { New-Item -Path $_ -Force | Out-Null }',
            '    }',
            '    Set-ItemProperty -Path $personalizePath -Name "AppsUseLightTheme" -Value 0 -Type DWord',
            '    Set-ItemProperty -Path $personalizePath -Name "SystemUsesLightTheme" -Value 0 -Type DWord',
            '    Set-ItemProperty -Path $dwmPath -Name "ColorizationColor" -Value 0xc4000000 -Type DWord',
            '    Set-ItemProperty -Path $dwmPath -Name "AccentColor" -Value 0xc40078d4 -Type DWord',
            '    Start-Process explorer.exe',
            '    Start-Sleep -Seconds 3',
            '    Write-Host "[OK] Dark Mode ON!" -ForegroundColor Green',
            '} catch {',
            '    Write-Host "[ERROR] $_" -ForegroundColor Red',
            '}',
            '',
            'Write-Host "DOWNLOAD WALLPAPER FROM GITHUB..." -ForegroundColor Yellow',
            '$imageUrl = "https://github.com/shivamjislt97/Windows-11-Latest-build/releases/download/wallpaper-v1/Windows%2011.png"',
            '$imagePath = "$downloadDir\Windows11.png"',
            'try {',
            '    Invoke-WebRequest -Uri $imageUrl -OutFile $imagePath -TimeoutSec 30',
            '    Write-Host "[OK] Downloaded wallpaper" -ForegroundColor Green',
            '} catch {',
            '    Write-Host "[ERROR] Download failed: $_" -ForegroundColor Red',
            '}',
            '',
            'Write-Host "SET WALLPAPER..." -ForegroundColor Yellow',
            'if ($imagePath -and (Test-Path $imagePath)) {',
            '    Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "WallPaper" -Value $imagePath',
            '    Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "TileWallpaper" -Value "0"',
            '    Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "WallpaperStyle" -Value "2"',
            '    RUNDLL32.EXE USER32.DLL,UpdatePerUserSystemParameters ,1 ,True',
            '    Write-Host "[OK] Wallpaper SET!" -ForegroundColor Green',
            '} else {',
            '    Write-Host "[ERROR] Image not found!" -ForegroundColor Red',
            '}',
            'Write-Host "COMPLETE!" -ForegroundColor Cyan'
          )
          $dmLines | Out-File "$desktop\SETUP-DARKMODE-WALLPAPER.ps1" -Encoding UTF8 -Force
          Write-Host "Dark mode + wallpaper script saved to: $desktop\SETUP-DARKMODE-WALLPAPER.ps1"

      - name: Create User & Set Password
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $u = "mastertech"
          $p = "Mast3rT3ch@2026!"
          $secpassword = ConvertTo-SecureString -AsPlainText $p -Force
          New-LocalUser -Name $u -Password $secpassword -FullName $u -Description "RDP User" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue
          Set-LocalUser -Name "runneradmin" -Password $secpassword
          Write-Host "User created: $u"

      - name: Enable RDP + Aggressive Optimization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $u = "mastertech"
          Write-Host "=== ENABLING RDP ==="
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Write-Host "=== RDP PERFORMANCE SETTINGS ==="
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'ColorDepth' -Value 2
          $tsPath = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          New-ItemProperty -Path $tsPath -Name 'AVC444ModePreferred' -Value 0 -PropertyType DWord -Force
