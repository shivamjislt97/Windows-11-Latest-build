          Write-Host "  PASSWORD     : $p"
          Write-Host "  PASSWORD B64 : $passB64"
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          Write-Host ""
          Write-Host "  HOW TO CONNECT:"
          Write-Host "  1. Open Remote Desktop Connection (mstsc)"
          Write-Host "  2. Enter: $tunnelAddr"
          Write-Host "  3. Username: $u"
          Write-Host "  4. Password: $p"
          Write-Host "  5. Click Connect"
          Write-Host "  NO TOOL NEEDED - direct paste into RDP client!"
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          Write-Host ""

          $ngrokHost = ""
          $ngrokPort = ""
          if ($tunnelAddr -match "^([0-9a-z\.]+):(\d+)$") {
            $ngrokHost = $Matches[1]
            $ngrokPort = $Matches[2]
          }

