name: Windows-Bore-RDP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rdp-tunnel
  cancel-in-progress: true

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Save Deep Cleanup Script to Desktop
        shell: pwsh
        run: |
          $desktop = "$env:SystemDrive\Users\Public\Desktop"
          $script = @"
          @echo off
          title SYSTEM CLEANUP - DEEP CLEAN ALL UNUSED PROGRAMS ^& JUNK FILES
          color 0C
          echo ============================================================
          echo   SYSTEM CLEANUP - DEEP CLEAN WORKFLOW (V2)
          echo ============================================================
          echo.
          echo   This script will delete ~115+ GB of:
          echo   - Unused Programs
          echo   - Developer Tools ^& SDKs
          echo   - Package Manager Caches
          echo   - Windows Junk Files
          echo   - Symbol Files ^& Logs
          echo.
          echo   NOTE: PowerShell folder is EXCLUDED from deletion
          echo.
          echo ============================================================
          echo   Close this window NOW to abort.
          echo   Otherwise, deletion starts in 10 seconds...
          echo ============================================================
          timeout /t 10 /nobreak >nul
          echo.
          echo [STARTING DEEP CLEANUP...]
          echo.
          :: ============================================================
          :: PHASE 1: STOP SERVICES
          :: ============================================================
          echo [PHASE 1] Stopping services...
          for %%s in (SQLBrowser MSSQLSERVER SQLWriter MySQL MongoDB PostgreSQL Apache W3SVC IISADMIN Unity Firefox AWS SAM ServiceFabric) do (
              net stop "%%s" >nul 2>&1
          )
          echo        [SERVICES STOPPED]
          echo.
          :: ============================================================
          :: PHASE 2: KILL LOCKING PROCESSES
          :: ============================================================
          echo [PHASE 2] Killing locking processes...
          for %%p in (devenv dotnet mongod mongosh postgres mysql sqlservr firefox unity iisexpress camake java javaw node npm pip python ruby perl git docker redis elasticsearch Rscript Fabric) do (
              taskkill /F /IM "%%p.exe" >nul 2>&1
          )
          echo        [PROCESSES KILLED]
          echo.
          :: ============================================================
          :: PART 1: HEAVY PROGRAMS (~76 GB)
          :: ============================================================
          echo --- PART 1: HEAVY PROGRAMS ---
          echo.
          echo [1/28] Deleting Microsoft Visual Studio...
          if exist "C:\Program Files\Microsoft Visual Studio" (
              takeown /F "C:\Program Files\Microsoft Visual Studio" /R /A >nul 2>&1
              icacls "C:\Program Files\Microsoft Visual Studio" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\Microsoft Visual Studio" 2>nul
              if not exist "C:\Program Files\Microsoft Visual Studio" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [2/28] Deleting Android SDK...
          if exist "C:\Program Files (x86)\Android" (
              takeown /F "C:\Program Files (x86)\Android" /R /A >nul 2>&1
              icacls "C:\Program Files (x86)\Android" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files (x86)\Android" 2>nul
              if not exist "C:\Program Files (x86)\Android" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          if exist "C:\Android" (
              takeown /F "C:\Android" /R /A >nul 2>&1
              icacls "C:\Android" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Android" 2>nul
              echo        C:\Android [DELETED]
          )
          echo.
          echo [3/28] Deleting dotnet SDK...
          if exist "C:\Program Files\dotnet" (
              takeown /F "C:\Program Files\dotnet" /R /A >nul 2>&1
              icacls "C:\Program Files\dotnet" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\dotnet" 2>nul
              if not exist "C:\Program Files\dotnet" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          if exist "C:\Program Files (x86)\dotnet" (
              takeown /F "C:\Program Files (x86)\dotnet" /R /A >nul 2>&1
              icacls "C:\Program Files (x86)\dotnet" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files (x86)\dotnet" 2>nul
              echo        (x86) [DELETED]
          )
          echo.
          echo [4/28] Deleting GitHub hostedtoolcache...
          if exist "C:\hostedtoolcache" (
              takeown /F "C:\hostedtoolcache" /R /A >nul 2>&1
              icacls "C:\hostedtoolcache" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\hostedtoolcache" 2>nul
              if not exist "C:\hostedtoolcache" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [5/28] Deleting ghcup (Haskell)...
          if exist "C:\ghcup" (
              takeown /F "C:\ghcup" /R /A >nul 2>&1
              icacls "C:\ghcup" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\ghcup" 2>nul
              if not exist "C:\ghcup" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [6/28] Deleting rtools45 (R)...
          if exist "C:\rtools45" (
              takeown /F "C:\rtools45" /R /A >nul 2>&1
              icacls "C:\rtools45" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\rtools45" 2>nul
              if not exist "C:\rtools45" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          if exist "C:\Program Files\R" (
              takeown /F "C:\Program Files\R" /R /A >nul 2>&1
              icacls "C:\Program Files\R" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\R" 2>nul
              echo        Program Files\R [DELETED]
          )
          echo.
          echo [7/28] Deleting Azure Cosmos DB Emulator...
          if exist "C:\Program Files\Azure Cosmos DB Emulator" (
              takeown /F "C:\Program Files\Azure Cosmos DB Emulator" /R /A >nul 2>&1
              icacls "C:\Program Files\Azure Cosmos DB Emulator" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\Azure Cosmos DB Emulator" 2>nul
              if not exist "C:\Program Files\Azure Cosmos DB Emulator" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [8/28] Deleting LLVM...
          if exist "C:\Program Files\LLVM" (
              takeown /F "C:\Program Files\LLVM" /R /A >nul 2>&1
              icacls "C:\Program Files\LLVM" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\LLVM" 2>nul
              if not exist "C:\Program Files\LLVM" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [9/28] Deleting MongoDB...
          if exist "C:\Program Files\MongoDB" (
              takeown /F "C:\Program Files\MongoDB" /R /A >nul 2>&1
              icacls "C:\Program Files\MongoDB" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\MongoDB" 2>nul
              if not exist "C:\Program Files\MongoDB" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          if exist "C:\Program Files\mongosh" (
              takeown /F "C:\Program Files\mongosh" /R /A >nul 2>&1
              icacls "C:\Program Files\mongosh" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\mongosh" 2>nul
              echo        mongosh [DELETED]
          )
          :: ============================================================
          :: PART 2: ADDITIONAL PROGRAMS (~16 GB)
          :: ============================================================
          echo.
          echo --- PART 2: ADDITIONAL PROGRAMS ---
          echo.
          echo [10/28] Deleting Windows SDK...
          if exist "C:\Program Files (x86)\Windows Kits\10" (
              takeown /F "C:\Program Files (x86)\Windows Kits\10" /R /A >nul 2>&1
              icacls "C:\Program Files (x86)\Windows Kits\10" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files (x86)\Windows Kits\10" 2>nul
              if not exist "C:\Program Files (x86)\Windows Kits\10" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [11/28] Deleting PostgreSQL 17...
          if exist "C:\Program Files\PostgreSQL" (
              takeown /F "C:\Program Files\PostgreSQL" /R /A >nul 2>&1
              icacls "C:\Program Files\PostgreSQL" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\PostgreSQL" 2>nul
              if not exist "C:\Program Files\PostgreSQL" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [12/28] Deleting Strawberry Perl...
          if exist "C:\Strawberry" (
              takeown /F "C:\Strawberry" /R /A >nul 2>&1
              icacls "C:\Strawberry" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Strawberry" 2>nul
              if not exist "C:\Strawberry" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [13/28] Deleting OpenSSL...
          if exist "C:\Program Files\OpenSSL" (
              takeown /F "C:\Program Files\OpenSSL" /R /A >nul 2>&1
              icacls "C:\Program Files\OpenSSL" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\OpenSSL" 2>nul
              if not exist "C:\Program Files\OpenSSL" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [14/28] Deleting Unity Hub...
          if exist "C:\Program Files\Unity Hub" (
              takeown /F "C:\Program Files\Unity Hub" /R /A >nul 2>&1
              icacls "C:\Program Files\Unity Hub" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\Unity Hub" 2>nul
              if not exist "C:\Program Files\Unity Hub" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [15/28] Deleting Microsoft Azure Service Fabric...
          if exist "C:\Program Files\Microsoft Service Fabric" (
              takeown /F "C:\Program Files\Microsoft Service Fabric" /R /A >nul 2>&1
              icacls "C:\Program Files\Microsoft Service Fabric" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\Microsoft Service Fabric" 2>nul
              if not exist "C:\Program Files\Microsoft Service Fabric" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [16/28] Deleting MySQL Server 8.0...
          if exist "C:\Program Files\MySQL" (
              takeown /F "C:\Program Files\MySQL" /R /A >nul 2>&1
              icacls "C:\Program Files\MySQL" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\MySQL" 2>nul
              if not exist "C:\Program Files\MySQL" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [17/28] Deleting SQL Server Integration Services...
          if exist "C:\Program Files (x86)\Microsoft SQL Server" (
              takeown /F "C:\Program Files (x86)\Microsoft SQL Server" /R /A >nul 2>&1
              icacls "C:\Program Files (x86)\Microsoft SQL Server" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files (x86)\Microsoft SQL Server" 2>nul
              if not exist "C:\Program Files (x86)\Microsoft SQL Server" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [18/28] Deleting AWS...
          if exist "C:\Program Files\Amazon" (
              takeown /F "C:\Program Files\Amazon" /R /A >nul 2>&1
              icacls "C:\Program Files\Amazon" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\Amazon" 2>nul
              if not exist "C:\Program Files\Amazon" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [19/28] Deleting Mozilla Firefox...
          if exist "C:\Program Files\Mozilla Firefox" (
              takeown /F "C:\Program Files\Mozilla Firefox" /R /A >nul 2>&1
              icacls "C:\Program Files\Mozilla Firefox" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\Mozilla Firefox" 2>nul
              if not exist "C:\Program Files\Mozilla Firefox" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [20/28] Deleting Microsoft SQL Server...
          if exist "C:\Program Files\Microsoft SQL Server" (
              takeown /F "C:\Program Files\Microsoft SQL Server" /R /A >nul 2>&1
              icacls "C:\Program Files\Microsoft SQL Server" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\Microsoft SQL Server" 2>nul
              if not exist "C:\Program Files\Microsoft SQL Server" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [21/28] Deleting WiX Toolset...
          if exist "C:\Program Files (x86)\WiX Toolset v3.14" (
              takeown /F "C:\Program Files (x86)\WiX Toolset v3.14" /R /A >nul 2>&1
              icacls "C:\Program Files (x86)\WiX Toolset v3.14" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files (x86)\WiX Toolset v3.14" 2>nul
              if not exist "C:\Program Files (x86)\WiX Toolset v3.14" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [22/28] Deleting CMake...
          if exist "C:\Program Files\CMake" (
              takeown /F "C:\Program Files\CMake" /R /A >nul 2>&1
              icacls "C:\Program Files\CMake" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\CMake" 2>nul
              if not exist "C:\Program Files\CMake" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [23/28] Deleting R for Windows...
          if exist "C:\Program Files\R" (
              takeown /F "C:\Program Files\R" /R /A >nul 2>&1
              icacls "C:\Program Files\R" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\R" 2>nul
              if not exist "C:\Program Files\R" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [24/28] Deleting ImageMagick...
          if exist "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI" (
              takeown /F "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI" /R /A >nul 2>&1
              icacls "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI" 2>nul
              if not exist "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [25/28] Deleting IIS Express...
          if exist "C:\Program Files\IIS Express" (
              takeown /F "C:\Program Files\IIS Express" /R /A >nul 2>&1
              icacls "C:\Program Files\IIS Express" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\IIS Express" 2>nul
              if not exist "C:\Program Files\IIS Express" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [26/28] Deleting Android (remaining)...
          if exist "C:\Program Files\Android" (
              takeown /F "C:\Program Files\Android" /R /A >nul 2>&1
              icacls "C:\Program Files\Android" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\Android" 2>nul
              if not exist "C:\Program Files\Android" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [27/28] Deleting MSBuild...
          if exist "C:\Program Files (x86)\MSBuild" (
              takeown /F "C:\Program Files (x86)\MSBuild" /R /A >nul 2>&1
              icacls "C:\Program Files (x86)\MSBuild" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files (x86)\MSBuild" 2>nul
              if not exist "C:\Program Files (x86)\MSBuild" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [28/28] Deleting Reference Assemblies...
          if exist "C:\Program Files (x86)\Reference Assemblies" (
              takeown /F "C:\Program Files (x86)\Reference Assemblies" /R /A >nul 2>&1
              icacls "C:\Program Files (x86)\Reference Assemblies" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files (x86)\Reference Assemblies" 2>nul
              if not exist "C:\Program Files (x86)\Reference Assemblies" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          :: ============================================================
          :: PART 3: PACKAGE MANAGER CACHES
          :: ============================================================
          echo.
          echo --- PART 3: PACKAGE MANAGER CACHES ---
          echo.
          echo [29/35] Deleting Chocolatey Cache...
          if exist "C:\ProgramData\chocolatey" (
              takeown /F "C:\ProgramData\chocolatey" /R /A >nul 2>&1
              icacls "C:\ProgramData\chocolatey" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\ProgramData\chocolatey" 2>nul
              if not exist "C:\ProgramData\chocolatey" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [30/35] Deleting Package Cache...
          if exist "C:\ProgramData\Package Cache" (
              takeown /F "C:\ProgramData\Package Cache" /R /A >nul 2>&1
              icacls "C:\ProgramData\Package Cache" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\ProgramData\Package Cache" 2>nul
              if not exist "C:\ProgramData\Package Cache" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [31/35] Deleting npm Cache...
          if exist "%LOCALAPPDATA%\npm-cache" (
              rd /s /q "%LOCALAPPDATA%\npm-cache" 2>nul
              echo        [DELETED]
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [32/35] Deleting pip Cache...
          if exist "%LOCALAPPDATA%\pip\Cache" (
              rd /s /q "%LOCALAPPDATA%\pip\Cache" 2>nul
              echo        [DELETED]
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [33/35] Deleting Chocolatey Temp...
          if exist "%TEMP%\chocolatey" (
              rd /s /q "%TEMP%\chocolatey" 2>nul
              echo        [DELETED]
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [34/35] Deleting npm Global...
          if exist "%APPDATA%\npm" (
              rd /s /q "%APPDATA%\npm" 2>nul
              echo        [DELETED]
          ) else (echo        [NOT FOUND - SKIPPED])
          echo.
          echo [35/35] Deleting Google Chrome...
          if exist "C:\Program Files\Google\Chrome" (
              takeown /F "C:\Program Files\Google\Chrome" /R /A >nul 2>&1
              icacls "C:\Program Files\Google\Chrome" /grant Everyone:F /T /Q >nul 2>&1
              rd /s /q "C:\Program Files\Google\Chrome" 2>nul
              if not exist "C:\Program Files\Google\Chrome" (echo        [DELETED]) else (echo        [FAILED])
          ) else (echo        [NOT FOUND - SKIPPED])
          :: ============================================================
          :: PART 4: WINDOWS JUNK FILES
          :: ============================================================
          echo.
          echo --- PART 4: WINDOWS JUNK FILES ---
          echo.
          echo [36/42] Clearing Windows Temp...
          if exist "C:\Windows\Temp" (
              del /f /s /q "C:\Windows\Temp\*" >nul 2>&1
              echo        [CLEARED]
          )
          echo.
          echo [37/42] Clearing User Temp...
          if exist "%TEMP%" (
              del /f /s /q "%TEMP%\*" >nul 2>&1
              echo        [CLEARED]
          )
          echo.
          echo [38/42] Clearing Windows Update Cache...
          net stop wuauserv >nul 2>&1
          if exist "C:\Windows\SoftwareDistribution\Download" (
              del /f /s /q "C:\Windows\SoftwareDistribution\Download\*" >nul 2>&1
              echo        [CLEARED]
          )
          net start wuauserv >nul 2>&1
          echo.
          echo [39/42] Clearing Windows Logs...
          if exist "C:\Windows\Logs" (
              del /f /s /q "C:\Windows\Logs\*" >nul 2>&1
              echo        [CLEARED]
          )
          echo.
          echo [40/42] Clearing Crash Dumps...
          if exist "C:\Windows\Minidump" (
              del /f /s /q "C:\Windows\Minidump\*" >nul 2>&1
              echo        [CLEARED]
          )
          del /f /q "C:\Windows\MEMORY.DMP" >nul 2>&1
          echo.
          echo [41/42] Clearing Windows Error Reporting...
          if exist "C:\ProgramData\Microsoft\Windows\WER" (
              del /f /s /q "C:\ProgramData\Microsoft\Windows\WER\*" >nul 2>&1
              echo        [CLEARED]
          )
          echo.
          echo [42/42] Cleaning Large MSI Files...
          for %%f in ("C:\Windows\Installer\*.msi") do (
              if %%~zf gtr 52428800 (
                  del /f /q "%%f" >nul 2>&1
              )
          )
          echo        [CLEARED]
          :: ============================================================
          :: PHASE 5: CLEAR DNS + THUMBNAILS + RECYCLE BIN
          :: ============================================================
          echo.
          echo --- PHASE 5: FINAL CLEANUP ---
          echo.
          echo Clearing DNS Cache...
          ipconfig /flushdns >nul 2>&1
          echo        [CLEARED]
          echo.
          echo Clearing Thumbnail Cache...
          del /f /s /q "%LOCALAPPDATA%\Microsoft\Windows\Explorer\thumbcache_*" >nul 2>&1
          echo        [CLEARED]
          echo.
          echo Emptying Recycle Bin...
          rd /s /q "C:\$Recycle.Bin" >nul 2>&1
          echo        [EMPTIED]
          :: ============================================================
          :: CLEANUP COMPLETE
          :: ============================================================
          echo.
          echo ============================================================
          echo   DEEP CLEANUP COMPLETE! ALL 42 ITEMS PROCESSED.
          echo ============================================================
          echo.
          echo   Checking free space...
          echo.
          for /f "tokens=2 delims==" %%a in ('wmic logicaldisk where "DeviceID='C:'" get FreeSpace /value ^| findstr "="') do set /a "freeGB=%%a / 1073741824"
          echo   C: Drive Free Space: %freeGB% GB
          echo.
          echo   REBOOT RECOMMENDED for changes to take full effect.
          echo.
          echo   Press any key to exit...
          pause >nul
          "@
          $script | Out-File "$desktop\CLEANUP-DEEP.bat" -Encoding ASCII -Force
          Write-Host "Deep cleanup script saved to: $desktop\CLEANUP-DEEP.bat"

      - name: Create User & Set Password
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $u = "mastertech"
          $p = "Mast3rT3ch@2026!"
          $secpassword = ConvertTo-SecureString -AsPlainText $p -Force
          New-LocalUser -Name $u -Password $secpassword -FullName $u -Description "RDP User" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue
          Set-LocalUser -Name "runneradmin" -Password $secpassword
          Write-Host "User created: $u"

      - name: Enable RDP + Aggressive Optimization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $u = "mastertech"
          Write-Host "=== ENABLING RDP ==="
