          Write-Host "=== AGGRESSIVE VISUAL EFFECTS OFF ==="
          $visPath = 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects'
          Set-ItemProperty -Path $visPath -Name 'VisualFXSetting' -Value 2 -Force
          $advPath = 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
          Set-ItemProperty -Path $advPath -Name 'TaskbarAnimations' -Value 0 -Force
          Set-ItemProperty -Path $advPath -Name 'ListviewShadow' -Value 0 -Force
          Set-ItemProperty -Path $advPath -Name 'IconsOnly' -Value 1 -Force
          Set-ItemProperty -Path $advPath -Name 'ListThreshold' -Value 1 -Force
