          } catch {
            Write-Host "Download failed: $_"
            throw "Cannot continue without ngrok"
          }
          & $ngrokExe version 2>&1 | Write-Host

          Write-Host "=== Authenticating ngrok ==="
          & $ngrokExe config add-authtoken 3Fz0A7Lz07ucwN6PWD6qJ93ULtR_3hv6fBSGSJf2m6qefyPoz 2>&1 | Write-Host

          Write-Host "=== Starting ngrok TCP tunnel (port 3389) ==="
          $ngrokLog = "$env:TEMP\ngrok-tunnel.log"
          Remove-Item $ngrokLog -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $ngrokExe -ArgumentList "tcp 3389 --log=stdout --log-format=json" -NoNewWindow -PassThru -RedirectStandardOutput $ngrokLog -RedirectStandardError "$env:TEMP\ngrok-err.log"
          Start-Sleep -Seconds 8

          $tunnelAddr = ""
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            try {
              $api = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5
              foreach ($t in $api.tunnels) {
                if ($t.public_url -match "^tcp://") {
                  $tunnelAddr = $t.public_url -replace "^tcp://", ""
                  break
                }
              }
              if ($tunnelAddr) { break }
            } catch {
              Write-Host "API not ready, retrying... (attempt $attempt)"
            }
            Start-Sleep -Seconds 3
          }

          if ([string]::IsNullOrWhiteSpace($tunnelAddr)) {
            $logContent = ""
            if (Test-Path $ngrokLog) { $logContent = Get-Content $ngrokLog -Raw -ErrorAction SilentlyContinue }
            Write-Host "ngrok log: $logContent"
            $tunnelAddr = "FAILED - could not get ngrok tunnel address"
          }

          Write-Host "TUNNEL ADDRESS: $tunnelAddr"

          $freeGB = [math]::Round((Get-PSDrive C).Free / 1GB, 2)
          $passB64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($p))

