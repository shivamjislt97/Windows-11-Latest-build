          2. Enter: ``$tunnelAddr``
          3. Username: ``$u``
          4. Password: ``$p``
          5. Click **Connect**

          > Direct paste into RDP client. No cloudflared, no SSH, no extra tool!
          > ngrok free plan: 1 GB data/month, ~1-2 hours RDP.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

          $credFile = "$env:SystemDrive\Users\Public\Desktop\RDP-CREDENTIALS.txt"
          @"
          RDP LOGIN CREDENTIALS
          ======================
          Host:Port : $tunnelAddr
          Username  : $u
          Password  : $p
          Pass B64  : $passB64

          HOW TO CONNECT:
          1. Open Remote Desktop Connection (mstsc)
          2. Enter: $tunnelAddr
          3. Username: $u
          4. Password: $p
          5. Click Connect
          NO TOOL NEEDED!
          ======================
          "@ | Out-File $credFile -Encoding UTF8 -Force

          Write-Host "Credentials saved to Step Summary + Desktop"
          Write-Host ""
          Write-Host "Tunnel LIVE - keeping alive..."

          while ($true) {
            Start-Sleep -Seconds 30
            if ($proc.HasExited) {
              Write-Host "$(Get-Date -Format 'HH:mm:ss') ngrok died, restarting..."
              Remove-Item $ngrokLog -Force -ErrorAction SilentlyContinue
              $proc = Start-Process -FilePath $ngrokExe -ArgumentList "tcp 3389 --log=stdout --log-format=json" -NoNewWindow -PassThru -RedirectStandardOutput $ngrokLog -RedirectStandardError "$env:TEMP\ngrok-err.log"
              Start-Sleep -Seconds 8
              try {
