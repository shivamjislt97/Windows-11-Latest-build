name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest        # 4 core / 16 GB RAM (public repo = free)
    timeout-minutes: 360           # max 6 hours, phir machine auto-destroy
    steps:
      - name: Enable RDP + set random password
        shell: powershell
        run: |
          # Random strong password generate karo
          Add-Type -AssemblyName System.Web
          $pass = [System.Web.Security.Membership]::GeneratePassword(16, 4)
          net user runneradmin "$pass"

          # RDP enable karo
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "=================================================="
          Write-Host "RDP Username : runneradmin"
          Write-Host "RDP Password : $pass"
          Write-Host "=================================================="

      - name: Install + connect Tailscale
        shell: powershell
        run: |
          # Tailscale install karo
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -UseBasicParsing "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          # tailscaled service start
          Start-Sleep 5
          Start-Service Tailscale 2>$null

          # auth key se connect (ephemeral node)
          & $ts up --authkey="${{ secrets.TS_AUTHKEY }}" --hostname=gh-rdp-runner --accept-routes
          Start-Sleep 5

          $ip = (& $ts ip -4)
          Write-Host "=================================================="
          Write-Host "Tailscale IP : $ip"
          Write-Host "Is IP par Remote Desktop se connect karo (aapke PC par bhi Tailscale login hona chahiye same account se)"
          Write-Host "Username : runneradmin"
          Write-Host "=================================================="

      - name: Keep alive (6 hours)
        shell: powershell
        run: Start-Sleep 21600
