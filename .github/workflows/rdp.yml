name: WindowsRDP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rdp-tunnel
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP + Full Optimization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'ColorDepth' -Value 4
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TcpAckFrequency' -Value 1
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TCPNoDelay' -Value 1
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'TcpDelAckTicks' -Value 0
          $tsPath = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          New-ItemProperty -Path $tsPath -Name 'AVC444ModePreferred' -Value 1 -PropertyType DWord -Force
          New-ItemProperty -Path $tsPath -Name 'AVCHardwareEncodePreferred' -Value 1 -PropertyType DWord -Force
          New-ItemProperty -Path $tsPath -Name 'bEnumerateHWBeforeSW' -Value 1 -PropertyType DWord -Force
          New-ItemProperty -Path $tsPath -Name 'AVCPreferredProfile' -Value 1 -PropertyType DWord -Force
          Set-ItemProperty -Path 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name 'VisualFXSetting' -Value 2 -Force
          Set-ItemProperty -Path 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name 'TaskbarAnimations' -Value 0 -Force
          Set-ItemProperty -Path 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name 'ListviewShadow' -Value 0 -Force
          Set-ItemProperty -Path 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name 'IconsOnly' -Value 1 -Force
          Set-ItemProperty -Path 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'EnableTransparency' -Value 0 -Force
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          Stop-Service -Name SysMain -Force
          Set-Service -Name SysMain -StartupType Disabled
          Stop-Service -Name DiagTrack -Force
          Set-Service -Name DiagTrack -StartupType Disabled
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters' -Name 'EnablePrefetcher' -Value 0 -Force
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters' -Name 'EnableSuperfetch' -Value 0 -Force
          Write-Host "RDP + Full Optimization DONE!"

      - name: Create User & Set Password
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $newUser = "mastertech"
          Add-Type -AssemblyName System.Web
          $pass = [System.Web.Security.Membership]::GeneratePassword(16, 4)
          $secpassword = ConvertTo-SecureString -AsPlainText $pass -Force
          New-LocalUser -Name $newUser -Password $secpassword -FullName $newUser -Description "RDP User" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $newUser -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $newUser -ErrorAction SilentlyContinue
          Set-LocalUser -Name "runneradmin" -Password $secpassword
          Write-Host "User '$newUser' created!"
          "RDP_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download & Start Bore Tunnel
        shell: pwsh
        run: |
          $sig = '[DllImport("kernel32.dll")] public static extern bool SetConsoleTitleW(string title);'
          Add-Type -MemberDefinition $sig -Name ConsoleAPI -Namespace Native -PassThru
          [Native.ConsoleAPI]::SetConsoleTitleW("DO NOT CLOSE - Bore RDP Tunnel")

          Write-Host "=== Downloading Bore ==="
          $boreUrl = "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $boreUrl -OutFile "$env:TEMP\bore.zip" -TimeoutSec 60
          Expand-Archive -Path "$env:TEMP\bore.zip" -DestinationPath "$env:TEMP\bore" -Force
          $boreExe = "$env:TEMP\bore\bore.exe"
          if (-not (Test-Path $boreExe)) {
            $boreExe = Get-ChildItem -Path "$env:TEMP\bore" -Filter "bore.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "Bore exe: $boreExe"
          & $boreExe --version 2>&1 | Write-Host
          Write-Host "=== Bore download DONE ==="

          Write-Host "=== Starting Bore Tunnel (port 3389) ==="
          $rdpPort = 3389
          $rdpUser = "mastertech"
          $rdpPass = $env:RDP_PASS
          if ([string]::IsNullOrWhiteSpace($rdpPass)) { $rdpPass = "mastertech" }

          $boreAddress = ""
          $boreLog = "$env:TEMP\bore-tunnel.log"

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "Attempt $attempt - Starting bore..."
            $proc = Start-Process -FilePath $boreExe -ArgumentList "local $rdpPort --to bore.pub" -NoNewWindow -PassThru -RedirectStandardOutput $boreLog -RedirectStandardError "$env:TEMP\bore-err.log"
            Start-Sleep -Seconds 5

            $output = ""
            if (Test-Path $boreLog) { $output = Get-Content $boreLog -Raw -ErrorAction SilentlyContinue }
            $errOutput = ""
            if (Test-Path "$env:TEMP\bore-err.log") { $errOutput = Get-Content "$env:TEMP\bore-err.log" -Raw -ErrorAction SilentlyContinue }

            Write-Host "Bore stdout: $output"
            Write-Host "Bore stderr: $errOutput"

            $allOutput = "$output $errOutput"
            if ($allOutput -match "bore\.pub:(\d+)") {
              $borePort = $Matches[1]
              $boreAddress = "bore.pub:$borePort"
              Write-Host "Tunnel established: $boreAddress"
              break
            }

            if ($proc.HasExited) {
              Write-Host "Bore exited early, restarting..."
              Start-Sleep -Seconds 3
            } else {
              Write-Host "Waiting for bore output..."
              Start-Sleep -Seconds 5
            }
          }

          if ([string]::IsNullOrWhiteSpace($boreAddress)) {
            $boreAddress = "FAILED - Could not establish bore tunnel. Check bore.pub server status."
          }

          $freeGB = [math]::Round((Get-PSDrive C).Free / 1GB, 2)
          $userSpaced = ($rdpUser.ToCharArray() -join ' ')
          $passSpaced = ($rdpPass.ToCharArray() -join ' ')
          $userB64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($rdpUser))
          $passB64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($rdpPass))

          Write-Host ""
          Write-Host "============================================"
          Write-Host "  RDP READY - ${freeGB}GB FREE!"
          Write-Host "============================================"
          Write-Host "  Address:  $boreAddress"
          Write-Host "  Username: $rdpUser"
          Write-Host "  Password: $rdpPass"
          Write-Host "============================================"
          Write-Host "  UNMASKED LOGIN (remove spaces):"
          Write-Host "  Username: $userSpaced"
          Write-Host "  Password: $passSpaced"
          Write-Host "  Username B64: $userB64"
          Write-Host "  Password B64: $passB64"
          Write-Host "============================================"
          Write-Host ""

          $credFile = "$env:SystemDrive\Users\Public\Desktop\RDP-CREDENTIALS.txt"
          @("============================================","  RDP LOGIN CREDENTIALS","============================================","  Address:  $boreAddress","  Username: $rdpUser","  Password: $rdpPass","  Username (spaced): $userSpaced","  Password (spaced): $passSpaced","  Username B64: $userB64","  Password B64: $passB64","============================================") | Out-File $credFile -Encoding UTF8 -Force

          @"
          ## RDP Credentials
          - **Address:** ``$boreAddress``
          - **Username:** ``$rdpUser``
          - **Password:** ``$rdpPass``
          - **Username (spaced):** ``$userSpaced``
          - **Password (spaced):** ``$passSpaced``
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

          Write-Host "Credentials saved to Desktop + Step Summary"
          Write-Host ""
          Write-Host "Tunnel LIVE - keeping alive 6 hours..."

          while ($true) {
            Start-Sleep -Seconds 30
            if ($proc.HasExited) {
              Write-Host "$(Get-Date -Format 'HH:mm:ss') Bore process died, restarting..."
              $proc = Start-Process -FilePath $boreExe -ArgumentList "local $rdpPort --to bore.pub" -NoNewWindow -PassThru -RedirectStandardOutput $boreLog -RedirectStandardError "$env:TEMP\bore-err.log"
              Start-Sleep -Seconds 5
              $newOutput = ""
              if (Test-Path $boreLog) { $newOutput = Get-Content $boreLog -Tail 5 -ErrorAction SilentlyContinue }
              Write-Host "Restart output: $newOutput"
            } else {
              Write-Host "$(Get-Date -Format 'HH:mm:ss') Tunnel alive (PID: $($proc.Id))"
            }
          }

      - name: Monitor - Report Status
        if: always()
        shell: pwsh
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          Write-Host "=== Monitor ==="
          Write-Host "Run: $runUrl"
          $boreProc = Get-Process -Name "bore" -ErrorAction SilentlyContinue
          if ($boreProc) {
            Write-Host "Bore: RUNNING (PID: $($boreProc.Id))"
          } else {
            Write-Host "Bore: NOT RUNNING"
          }
          "## RDP Status`n- Run: [$env:GITHUB_REPOSITORY#$env:GITHUB_RUN_ID]($runUrl)`n- Time: $(Get-Date)`n- Bore tunnel active on port 3389" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
