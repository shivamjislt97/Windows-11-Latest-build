name: Windows-Bore-RDP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rdp-tunnel
  cancel-in-progress: true

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
